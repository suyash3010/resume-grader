AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Resume Grader Serverless Application'

Parameters:
  OpenAIApiKey:
    Type: String
    NoEcho: true
    Description: OpenAI API Key for resume grading
  CognitoUserPoolId:
    Type: String
    Description: AWS Cognito User Pool ID
  CognitoClientId:
    Type: String
    Description: AWS Cognito Client ID
  CognitoClientSecret:
    Type: String
    NoEcho: true
    Description: AWS Cognito Client Secret
  CognitoDomain:
    Type: String
    Description: AWS Cognito Domain name
  CognitoRegion:
    Type: String
    Default: eu-west-1
    Description: AWS Region for Cognito

Resources:
  UserActivityTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: resume-grader-user-activity
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: email
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  ResumeGraderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: resume-grader-function
      CodeUri: .
      Handler: app.lambda_handler
      Runtime: python3.11
      MemorySize: 1024
      Timeout: 300
      Environment:
        Variables:
          OPENAI_API_KEY: !Ref OpenAIApiKey
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_CLIENT_SECRET: !Ref CognitoClientSecret
          COGNITO_DOMAIN: !Ref CognitoDomain
          COGNITO_REGION: !Ref CognitoRegion
          ACTIVITY_TABLE_NAME: !Ref UserActivityTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UserActivityTable
      Events:
        HttpApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ResumeGraderApiEndpoint:
    Description: HTTP API endpoint URL
    Value: !Sub 'https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com'

  ResumeGraderFunctionArn:
    Description: Resume Grader Lambda Function ARN
    Value: !GetAtt ResumeGraderFunction.Arn
